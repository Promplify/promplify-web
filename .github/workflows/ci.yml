name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Build application
        run: npm run build

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.115.0

      - name: Start local Supabase
        run: supabase start

      - name: Verify migrations and seed
        run: supabase db reset

      - name: Lint database functions
        run: supabase db lint --local --level warning --fail-on warning

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  security:
    name: Authorization regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Pull official integration images
        run: |
          docker pull postgres:17-alpine
          docker pull public.ecr.aws/supabase/gotrue:v2.186.0
          docker pull postgrest/postgrest:v13.0.7

      - name: Verify database security contracts
        run: node scripts/test-profile-privacy.mjs

      - name: Verify real authentication and Data API access
        run: node scripts/test-profile-e2e.mjs
